name: Build FFmpeg Tools

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_VERSION: 0.4.1

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller platformdirs httpx

    - name: Download FFmpeg binaries
      run: python scripts/download_ffmpeg_binaries.py

    - name: Build with PyInstaller
      run: pyinstaller ffmpeg_gui.spec

    - name: Package application
      run: |
        cd dist
        7z a -tzip FFmpegTools-${{ env.APP_VERSION }}-Windows.zip FFmpegTools/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegTools-Windows
        path: dist/FFmpegTools-${{ env.APP_VERSION }}-Windows.zip
        retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller platformdirs httpx

    - name: Download FFmpeg binaries
      run: python scripts/download_ffmpeg_binaries.py

    - name: Build with PyInstaller
      run: pyinstaller ffmpeg_gui.spec

    - name: Create DMG (optional)
      run: |
        # 简单打包为 zip，或使用 create-dmg 工具创建 DMG
        cd dist
        zip -r FFmpegTools-${{ env.APP_VERSION }}-macOS.zip FFmpegTools.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegTools-macOS
        path: dist/FFmpegTools-${{ env.APP_VERSION }}-macOS.zip
        retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller platformdirs httpx

    - name: Download FFmpeg binaries
      run: python scripts/download_ffmpeg_binaries.py

    - name: Build with PyInstaller
      run: pyinstaller ffmpeg_gui.spec

    - name: Package application
      run: |
        cd dist
        tar -czf FFmpegTools-${{ env.APP_VERSION }}-Linux.tar.gz FFmpegTools/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegTools-Linux
        path: dist/FFmpegTools-${{ env.APP_VERSION }}-Linux.tar.gz
        retention-days: 30

  # 如果是打 tag，自动创建 Release
  release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/FFmpegTools-Windows/*.zip
          artifacts/FFmpegTools-macOS/*.zip
          artifacts/FFmpegTools-Linux/*.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
