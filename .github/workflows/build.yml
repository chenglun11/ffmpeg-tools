name: Build FFmpeg Tools

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - id: get
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          v=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
        fi

  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller platformdirs httpx

    - name: Download FFmpeg binaries
      run: |
        python scripts/download_ffmpeg_binaries.py
        echo "Checking downloaded files:"
        dir src\ffmpeg_tui\resources\ffmpeg\ /s
      shell: cmd

    - name: Build with PyInstaller
      run: pyinstaller ffmpeg_gui.spec --noconfirm

    - name: Package application
      run: |
        cd dist
        7z a -tzip FFmpegTools-${{ env.APP_VERSION }}-Windows.zip FFmpegTools.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegTools-Windows
        path: dist/FFmpegTools-${{ env.APP_VERSION }}-Windows.zip
        retention-days: 30

  build-macos:
    name: Build macOS
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller platformdirs httpx

    - name: Download FFmpeg binaries
      run: |
        python scripts/download_ffmpeg_binaries.py
        echo "Checking downloaded files:"
        ls -lR src/ffmpeg_tui/resources/ffmpeg/

    - name: Build with PyInstaller
      run: pyinstaller ffmpeg_gui.spec --noconfirm

    - name: Create DMG (optional)
      run: |
        cd dist
        zip -r FFmpegTools-${{ env.APP_VERSION }}-macOS.zip FFmpegTools.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegTools-macOS
        path: dist/FFmpegTools-${{ env.APP_VERSION }}-macOS.zip
        retention-days: 30

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller platformdirs httpx

    - name: Download FFmpeg binaries
      run: |
        python scripts/download_ffmpeg_binaries.py
        echo "Checking downloaded files:"
        ls -lR src/ffmpeg_tui/resources/ffmpeg/

    - name: Build with PyInstaller
      run: pyinstaller ffmpeg_gui.spec --noconfirm

    - name: Package application
      run: |
        cd dist
        tar -czf FFmpegTools-${{ env.APP_VERSION }}-Linux.tar.gz FFmpegTools

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpegTools-Linux
        path: dist/FFmpegTools-${{ env.APP_VERSION }}-Linux.tar.gz
        retention-days: 30

  # 如果是打 tag，自动创建 Release
  release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/FFmpegTools-Windows/*.zip
          artifacts/FFmpegTools-macOS/*.zip
          artifacts/FFmpegTools-Linux/*.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
